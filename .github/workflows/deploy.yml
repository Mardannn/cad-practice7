name: ci-cd
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: mkdir dist && cp index.html dist/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::089685042565:role/github-actions-practice7
          aws-region: eu-central-1
      - name: Deploy
        run: aws s3 sync dist/ s3://bolatbek-cad-p7-2026 --delete
